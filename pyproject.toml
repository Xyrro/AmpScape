[project]
name = "ampscape"
version = "0.0.1"
description = "Benchmark dataset and evaluation suite for learned surrogates of circuit-theoretic landscape connectivity (Circuitscape / Omniscape)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
authors = [{ name = "AmpScape contributors" }]
keywords = ["landscape connectivity", "circuitscape", "omniscape", "surrogate", "benchmark", "neural operator"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy==2.4.6",
  "scipy==1.17.1",
  "rasterio==1.4.4",
  "pyproj==3.7.2",
  "shapely==2.1.2",
  "geopandas==1.1.4",
  "pyarrow==25.0.1",
  "pandas==3.0.5",
  "h5py==3.16.0",
  "zarr==3.1.6",
  "xarray==2026.7.0",
  "pyyaml==6.0.3",
  "pydantic==2.13.5",
  "datasets==5.0.1",
  "huggingface_hub==1.30.0",
  "torch==2.14.0",
  "torchvision==0.29.0",
  "lightning==2.6.5",
  "neuraloperator==2.0.0",
  "torch_geometric==2.8.0.post1",
  "matplotlib==3.11.1",
  "tqdm==4.70.0",
  "joblib==1.6.0",
  "nlmpy==1.2.0",
  "scikit-image==0.26.0",
  "juliacall==0.9.35",
  "numba==0.67.0",
  "tabulate==0.10.0",
  "mlcroissant==1.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.6",
  "pre-commit==4.6.2",
  "jupyter==1.1.1",
  "ipykernel==7.3.0",
]

[project.scripts]
ampscape = "ampscape.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ampscape"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "julia_depot", ".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ampscape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: long-running tests (deselect with -m 'not slow')",
  "julia: tests that require the Julia solver package",
  "gpu: tests that require a GPU",
]

# PACE-ICE GPU nodes run driver 575 / CUDA 12.9: PyPI's torch 2.14 wheel is built for CUDA 13.0 and refuses to
# initialise, so torch/torchvision come from the cu126 index (the only 2.14.0 CUDA-12 build published) (docs/compute_env.md).
[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
